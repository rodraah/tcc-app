browser:
  # auto | chrome | msedge | chromium — auto escolhe Edge/Chrome instalado.
  channel: auto
  # Anexar a Chrome/Edge já aberto com --remote-debugging-port=9222 (ex.: http://127.0.0.1:9222).
  # Vazio = lança o channel acima. Preferível para cookies/sessão e menos desafio.
  cdp_url: ""
  # Perfil persistente local (só se cdp_url vazio). Reduz CAPTCHA entre sessões.
  user_data_dir: ".browser-profile"
  headless: false
  default_url: https://www.bing.com
  search_url: "https://www.bing.com/search?q={query}"
  # Usado só se Bing bloquear (CAPTCHA / desafio).
  fallback_search_url: "https://duckduckgo.com/?q={query}"
  # Se a aba atual for YouTube, "pesquisar X" usa isto em vez do Bing.
  youtube_search_url: "https://www.youtube.com/results?search_query={query}"
  scroll_amount: 600
  scroll_steps: 1
  scroll_step_ms: 0
  click_fuzzy_threshold: 75
  link_selectors:
    duckduckgo: "li.b_algo h2 a"
    generic: "main a[href], article a[href]"

