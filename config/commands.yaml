wake_word: assistente
wake_word_required: false
fuzzy_threshold: 70
verb_fuzzy_threshold: 70
cooldown_seconds: 0.5
cooldown_exempt:
  - hotkey
  - press_key
  - browser_scroll
  - volume
  - switch_window
  - window_action
  - browser_zoom
  - browser_switch_tab
  - browser_youtube

audio:
  sample_rate: 16000
  ambient_noise_duration: 1.5
  dynamic_energy_threshold: true
  energy_threshold: 300
  # Frases de 2+ palavras (ex.: "selecionar tudo"): se cortar o 2º termo, suba para ~1.0
  pause_threshold: 0.95
  non_speaking_duration: 0.5
  phrase_time_limit: 12
  listen_timeout: 10
  recalibrate_every: 30

stt:
  engine: google
  language: pt-BR
  vosk_model_path: models/vosk-model-pt-fb-v0.1.1-pruned
  vosk_use_grammar: false
  # Offline preferido quando Google falha (senão Vosk).
  whisper_model: base
  whisper_device: cpu
  whisper_compute_type: int8
  # "holly para baixo"≈"role para baixo" ~84 — 80 cobre STT ruim sem abrir demais.
  soft_correct_threshold: 80

tts:
  enabled: true

